name: leo_bakox
display_name: Leo Bakok
version: 2.0.0
author:
  name: "Leotheme Team"
  email: "demo@demo.com"
  url: "#"

meta:
  compatibility:
    from: 9.0.0
    to: ~

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages such as product pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column

assets:
  # If you're using this theme as child and you want to load
  # the parent theme assets, uncomment this line.
#  use_parent_assets: true

  # The following lines are showing how to load assets in your page
  # Uncomment and change value to start loading css or js files
#  css:
#    all:
#      - id: custom-lib-style
#        path: assets/css/custom-lib.css
#    product:
#      - id: product-style
#        path: assets/css/product.css
#        media: all
#        priority: 200
#  js:
#    cart:
#      - id: cat-extra-lib
#        path: assets/js/cart-lib.js

dependencies:
  modules:
    - leoelements
    - leobootstrapmenu
    - leoslideshow
    - leoblog
    - leofeature
    - blockgrouptop
    - leoquicklogin
    - leoproductsearch
    - leogallery
global_settings:
  configuration:
    PS_IMAGE_QUALITY: png
  modules:
   to_disable:
     - ps_contactinfo
     - ps_mainmenu
     - ps_imageslider
     - ps_featuredproducts
     - ps_banner
     - ps_customtext
     - productcomments
     - blockwishlist
  hooks:
    modules_to_hook:
      header:
        - leoelements
      displayBanner:
        - leoelements
      displayDashboardTop:
        - leoelements
      backOfficeHeader:
        - leoelements
      backOfficeFooter:
        - leoelements
      actionObjectAddAfter:
        - leoelements
      actionObjectUpdateAfter:
        - leoelements
      actionCmsPageFormBuilderModifier:
        - leoelements
      overrideLayoutTemplate:
        - leoelements
      moduleRoutes:
        - leoelements
      filterCmsContent:
        - leoelements
      filterCategoryContent:
        - leoelements
      displayHeaderCategory:
        - leoelements
      displayFooterCategory:
        - leoelements
      leoECatConfig:
        - leoelements
      actionCategoryFormBuilderModifier:
        - leoelements
      actionAfterUpdateCategoryFormHandler:
        - leoelements
      actionAfterCreateCategoryFormHandler:
        - leoelements
      actionObjectProductUpdateAfter:
        - leoelements
      filterProductContent:
        - leoelements
      displayFooterProduct:
        - leoelements
      displayAdminProductsExtra:
        - leoelements
      displayAfterBodyOpeningTag:
        - blockreassurance
      displayNavFullWidth:
        - leoelements
      displayNav1:
        - leoelements
      displayNav2:
        - leoelements
      displayTop:
        - leoelements
      displayHome:
        - leoelements
      displayFooterBefore:
        - leoelements
      displayFooter:
        - leoelements
      displayFooterAfter:
        - leoelements
      displayLeftColumn:
        - leoelements
        - ps_categorytree
        - ps_facetedsearch
      displayContactLeftColumn:
        - ps_contactinfo
      displayContactRightColumn:
        - ps_contactinfo
        - leoelements
      displaySearch:
        - leoelements
        - ps_searchbar
      displayProductAdditionalInfo:
        - leoelements
        - ps_sharebuttons
      displayReassurance:
        - leoelements
      displayOrderConfirmation2:
        - leoelements
      displayCrossSellingShoppingCart:
        - leoelements
      actionAdminControllerSetMedia:
        - leoelements
        - leobootstrapmenu
        - leoslideshow
        - leoblog
        - leofeature
        - blockgrouptop
        - leoquicklogin
        - leoproductsearch
        - leogallery
        - dashgoals
        - dashtrends
        - dashactivity
      actionAdminBefore:
        - leoelements
        - leobootstrapmenu
        - leoslideshow
        - leoblog
        - leofeature
        - blockgrouptop
        - leoquicklogin
        - leoproductsearch
        - leogallery
  image_types:
    cart_default:
      width: 125
      height: 125
      scope: [products]
    small_default:
      width: 98
      height: 98
      scope: [products, categories, manufacturers, suppliers]
    medium_default:
      width: 452
      height: 452
      scope: [products, manufacturers, suppliers]
    home_default:
      width: 250
      height: 250
      scope: [products]
    large_default:
      width: 800
      height: 800
      scope: [products, manufacturers, suppliers]
    category_default:
      width: 141
      height: 180
      scope: [categories]
    stores_default:
      width: 170
      height: 115
      scope: [ stores ]
  new_password_policy_feature: true

theme_settings:
  default_layout: layout-full-width
  layouts:
    category: layout-left-column
    best-sales: layout-left-column
    new-products: layout-left-column
    prices-drop: layout-left-column
    contact: layout-left-column
    manufacturer: layout-left-column
    supplier: layout-left-column